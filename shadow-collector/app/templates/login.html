<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexio Shadow Collector Login</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card">
      <p class="eyebrow">Shadow autoplay telemetry</p>
      <h1>Sign in</h1>
      <p class="lede">Access the internal dashboard for autoplay decision analytics.</p>
      {% if error %}<p class="error-banner">{{ error }}</p>{% endif %}
      <form method="post" class="stack">
        <label class="field stack">
          <span>Username</span>
          <input name="username" autocomplete="username">
        </label>
        <label class="field stack">
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password">
        </label>
        <button class="button" type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
