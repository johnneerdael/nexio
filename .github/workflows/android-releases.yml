                exit 1
              fi
            done
          done
          echo "NEXIO_PREBUILT_FFMPEG_ROOT=${PREBUILT_DIR}" >> "$GITHUB_ENV"

      - name: Prepare signing key from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
