          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "Missing release signing secrets. Set RELEASE_KEY_ALIAS, RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_PASSWORD."
            exit 1
          fi
          if [ ! -f "nexio.jks" ]; then
