name: Android Releases

on:
  push:
    tags:
      - 'v*'
      - 'beta-*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release channel to publish'
        required: true
        type: choice
        default: beta
        options:
          - stable
          - beta
      release_tag:
        description: 'Tag to use for stable publish (required when manually triggering stable)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  stable-release:
    name: Build and publish stable release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_type == 'stable')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.SUBMODULES_PAT || github.token }}

      - name: Configure GitHub token auth for private submodules
        env:
          GH_SUBMODULE_TOKEN: ${{ secrets.SUBMODULES_PAT || github.token }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GH_SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive media dovi_tool tools/frontiersimulator

      - name: Apply stable release version from tag
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_type == 'stable')
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TAG_NAME="${INPUT_TAG:-$EVENT_TAG}"
          if [ -z "$TAG_NAME" ]; then
            echo "Stable release tag could not be resolved." >&2
            exit 1
          fi

          VERSION_NAME="${TAG_NAME#v}"
          if ! echo "$VERSION_NAME" | grep -Eq '^[0-9]+(\.[0-9]+)*([.-].*)?$'; then
            echo "Resolved version name '$VERSION_NAME' does not look like a release tag" >&2
            exit 1
          fi

          CURRENT_VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$CURRENT_VERSION_CODE" ]; then
            echo "versionCode not found in app/build.gradle.kts" >&2
            exit 1
          fi

          NEW_VERSION_CODE=$((CURRENT_VERSION_CODE + 1))
          perl -0pi -e "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = ${NEW_VERSION_CODE}/" app/build.gradle.kts
          perl -0pi -e "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

          echo "versionCode=${NEW_VERSION_CODE}"
          echo "versionName=${VERSION_NAME}"

      - name: Commit stable version bump
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'stable'
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TAG_NAME="${INPUT_TAG:-$EVENT_TAG}"
          if [ -z "$TAG_NAME" ]; then
            echo "Stable release tag could not be resolved." >&2
            exit 1
          fi

          VERSION_NAME="${TAG_NAME#v}"
          if git diff --quiet -- app/build.gradle.kts; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore(release): bump version to ${VERSION_NAME}"  
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Lint and build universal release APK
        run: ./gradlew :app:lintUniversalRelease :app:assembleUniversalRelease

      - name: Verify release APK signature
        run: |
          set -euo pipefail

          APK_PATH=$(find app/build/outputs/apk -type f -name "*universal*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Stable APK artifact not found" >&2
            exit 1
          fi

          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -n "$APKSIGNER" ]; then
            APKSIGNER="$(find "$APKSIGNER/build-tools" -path '*/apksigner' -type f 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(command -v apksigner || true)"
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in runner environment" >&2
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Prepare stable APK filename
        id: stable_asset
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          APK_PATH=$(find app/build/outputs/apk -type f -name "*universal*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Stable APK artifact not found" >&2
            exit 1
          fi

          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "$TAG" = "main" ] || [ -z "$TAG" ]; }; then
            echo "Release tag is required for manual stable runs. Set workflow input release_tag." >&2
            exit 1
          fi

          mkdir -p app/build/outputs/apk/release
          cp "$APK_PATH" app/build/outputs/apk/release/nexio_stable.apk
          echo "path=app/build/outputs/apk/release/nexio_stable.apk" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish/update stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.stable_asset.outputs.tag }}"
          ASSET="${{ steps.stable_asset.outputs.path }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "Nexio ${TAG}" --generate-notes
          fi

  beta-release:
    name: Build and publish beta release
    if: startsWith(github.ref, 'refs/tags/beta-') || (github.event_name == 'workflow_dispatch' && inputs.release_type == 'beta')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.SUBMODULES_PAT || github.token }}

      - name: Configure GitHub token auth for private submodules
        env:
          GH_SUBMODULE_TOKEN: ${{ secrets.SUBMODULES_PAT || github.token }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GH_SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive media dovi_tool tools/frontiersimulator

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Lint and build universal release APK
        run: ./gradlew :app:lintUniversalRelease :app:assembleUniversalRelease

      - name: Verify beta APK signature
        run: |
          set -euo pipefail

          APK_PATH=$(find app/build/outputs/apk -type f -name "*universal*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Beta APK artifact not found" >&2
            exit 1
          fi

          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -n "$APKSIGNER" ]; then
            APKSIGNER="$(find "$APKSIGNER/build-tools" -path '*/apksigner' -type f 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(command -v apksigner || true)"
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in runner environment" >&2
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Prepare beta APK filename
        id: beta_asset
        run: |
          set -euo pipefail

          APK_PATH=$(find app/build/outputs/apk -type f -name "*universal*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Beta APK artifact not found" >&2
            exit 1
          fi

          mkdir -p app/build/outputs/apk/release
          cp "$APK_PATH" app/build/outputs/apk/release/nexio_beta.apk
          echo "path=app/build/outputs/apk/release/nexio_beta.apk" >> "$GITHUB_OUTPUT"

      - name: Publish moving beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="beta"
          ASSET="${{ steps.beta_asset.outputs.path }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi

          gh release create "$TAG" "$ASSET" --prerelease --title "Nexio Beta (${GITHUB_SHA:0:7})"
