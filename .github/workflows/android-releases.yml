            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > nexio.jks
          fi
          echo "KEYSTORE_FILE=$(pwd)/nexio.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build release armv7 APK
        id: beta_armv7_build
        run: |
          set -euo pipefail
          STARTED_AT="$(date -u +%s)"
          ./gradlew ${GRADLE_COMMON_ARGS} :app:lintArmv7Release :app:assembleArmv7Release \
            -PNEXIO_NATIVE_ABI_FILTER=armeabi-v7a \
            -PNEXIO_PREBUILT_FFMPEG_ROOT="${NEXIO_PREBUILT_FFMPEG_ROOT}"
          DURATION_SEC=$(( $(date -u +%s) - STARTED_AT ))
          echo "Armv7 release build succeeded in ${DURATION_SEC}s"
          APK_PATH=$(find app/build/outputs/apk -type f -name "*armv7*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "armv7 release APK not found after successful build." >&2
            exit 1
          fi
          mkdir -p app/build/outputs/apk/release
          cp "$APK_PATH" app/build/outputs/apk/release/nexio_armv7_beta.apk
          echo "apk_path=app/build/outputs/apk/release/nexio_armv7_beta.apk" >> "$GITHUB_OUTPUT"
      - name: Upload armv7 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-armv7-apk
          path: app/build/outputs/apk/release/nexio_armv7_beta.apk
          if-no-files-found: error

  beta_release:
    name: Build and publish beta release
    if: always() && (needs['beta-universal-build'].result == 'success' || needs['beta-armv7-build'].result == 'success')
    runs-on: ubuntu-latest
    needs:
      - beta-universal-build
      - beta-armv7-build
    steps:
      - name: Download beta universal APK artifact
        id: beta_universal_artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: beta-universal-apk
          path: artifacts/beta/universal
      - name: Download beta armv7 APK artifact
        id: beta_armv7_artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: beta-armv7-apk
          path: artifacts/beta/armv7
      - name: Select beta APK artifact
        id: beta_asset
        run: |
          set -euo pipefail
          UNIVERSAL_APK=$(find artifacts/beta/universal -type f -name "*.apk" | head -n 1 || true)
          ARMV7_APK=$(find artifacts/beta/armv7 -type f -name "*.apk" | head -n 1 || true)
          if [ -n "$UNIVERSAL_APK" ]; then
            mkdir -p app/build/outputs/apk/release
            cp "$UNIVERSAL_APK" app/build/outputs/apk/release/nexio_beta.apk
            echo "path=app/build/outputs/apk/release/nexio_beta.apk" >> "$GITHUB_OUTPUT"
            echo "variant=universal" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$ARMV7_APK" ]; then
            mkdir -p app/build/outputs/apk/release
            cp "$ARMV7_APK" app/build/outputs/apk/release/nexio_beta.apk
            echo "path=app/build/outputs/apk/release/nexio_beta.apk" >> "$GITHUB_OUTPUT"
            echo "variant=armv7" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No beta APK artifact was produced." >&2
          exit 1
      - name: Verify beta APK signature
        run: |
          set -euo pipefail
          APK_PATH="${{ steps.beta_asset.outputs.path }}"
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -n "$APKSIGNER" ]; then
            APKSIGNER="$(find "$APKSIGNER/build-tools" -path '*/apksigner' -type f 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(command -v apksigner || true)"
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in runner environment" >&2
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK_PATH"
      - name: Prepare beta APK filename
        id: beta_asset_path
        run: |
          set -euo pipefail
          APK_PATH="${{ steps.beta_asset.outputs.path }}"
          if [ -z "$APK_PATH" ]; then
            echo "Beta APK artifact not found" >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
      - name: Publish moving beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="beta"
          ASSET="${{ steps.beta_asset_path.outputs.path }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" "$ASSET" --prerelease --title "Nexio Beta (${GITHUB_SHA:0:7})"
