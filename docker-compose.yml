services:
  nexio-web:
    build:
      context: ./nexio-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      NUXT_SUPABASE_URL: ${NUXT_SUPABASE_URL:-}
      NUXT_SUPABASE_ANON_KEY: ${NUXT_SUPABASE_ANON_KEY:-}
      NUXT_SUPABASE_SERVICE_ROLE_KEY: ${NUXT_SUPABASE_SERVICE_ROLE_KEY:-}
      NUXT_TRAKT_CLIENT_ID: ${NUXT_TRAKT_CLIENT_ID:-}
      NUXT_TRAKT_CLIENT_SECRET: ${NUXT_TRAKT_CLIENT_SECRET:-}
      NUXT_REAL_DEBRID_CLIENT_ID: ${NUXT_REAL_DEBRID_CLIENT_ID:-}
      NUXT_REAL_DEBRID_CLIENT_SECRET: ${NUXT_REAL_DEBRID_CLIENT_SECRET:-}
      NUXT_PUBLIC_SUPABASE_URL: ${NUXT_PUBLIC_SUPABASE_URL:-}
      NUXT_PUBLIC_SUPABASE_ANON_KEY: ${NUXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NUXT_PUBLIC_TV_LOGIN_BASE_URL: ${NUXT_PUBLIC_TV_LOGIN_BASE_URL:-}
    expose:
      - "4000"
    networks:
      - default
      - caddy_net

networks:
  caddy_net:
    external: true
    name: caddy-net
