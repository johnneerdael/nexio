SUPABASE_URL=your_supabase_url_here
SUPABASE_ANON_KEY=your_supabase_anon_key_here
TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob

# --- Metadata provider credentials ---
# TMDB and TheTVDB are enabled by default. Add these only for app builds that should
# use a built-in provider key instead of requiring users to configure their own keys.
TMDB_API_KEY=
TMDB_API_URL=https://api.themoviedb.org/3/
TVDB_API_KEY=
TVDB_API_URL=https://api4.thetvdb.com/v4/

# --- Media3 fork / DV7/libdovi flags ---
# Clean checkouts build against source-integrated Media3 from the local `media/` folder by default.
# Set USE_MEDIA3_SOURCE=false only when intentionally testing the legacy prebuilt AAR path.
# USE_MEDIA3_SOURCE=false

# Enables dovi_bridge native build + runtime bridge loading.
DOVI_NATIVE_ENABLED=true

# Marks extractor hook integration as available in the current build.
DOVI_EXTRACTOR_HOOK_READY=true

# Enables linking a prebuilt libdovi static archive into dovi_bridge.
DOVI_ENABLE_REAL_LINK=true
# DOVI_LIBDOVI_STATIC_LIB=C:\\path\\to\\libdovi.a
# DOVI_LIBDOVI_INCLUDE_DIR=C:\\path\\to\\libdovi\\include
DOVI_LIBDOVI_PREBUILT_ROOT=third_party/libdovi
